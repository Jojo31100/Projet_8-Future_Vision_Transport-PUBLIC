name: Build and Push Docker image to Azure Container Registry - openclassrooms-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: openclassrooms-api
  TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      #Etape 1 : Récupération du code
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      #Etape 2 : Construction de l’image Docker à partir du Dockerfile
      - name: 🐳 Build Docker image
        run: |
          echo "Building ${IMAGE_NAME}:${TAG}..."
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} .

      #Etape 3 : Connexion à ton registre de conteneurs Azure (ACR)
      - name: 🔑 Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      #Etape 4 : Envoi de l’image vers ACR
      - name: 🚀 Push Docker image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      #Etape 5 : Confirmation
      - name: ✅ Done
        run: echo "Image pushed to ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
