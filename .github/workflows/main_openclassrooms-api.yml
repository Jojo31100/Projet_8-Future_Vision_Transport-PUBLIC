name: Build and deploy Python app to Azure Web App - openclassrooms-api

#on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: 📦 Checkout repository and LFS files
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: 🐍 Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 🔧 Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      
      - name: 🧹 Clean up unnecessary files to reduce size
        run: |
          source antenv/bin/activate
          
          # Supprimer les fichiers de test et documentation
          find antenv -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find antenv -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find antenv -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find antenv -name "*.pyc" -delete
          find antenv -name "*.pyo" -delete
          
          # Supprimer les fichiers .dist-info et .egg-info (gardons juste les metadata essentielles)
          find antenv -type d -name "*.dist-info" -exec sh -c 'rm -rf "$1"/RECORD "$1"/INSTALLER "$1"/direct_url.json 2>/dev/null || true' _ {} \;
          
          # Torch : supprimer les fichiers de test et examples
          rm -rf antenv/lib/python*/site-packages/torch/test 2>/dev/null || true
          rm -rf antenv/lib/python*/site-packages/torch/testing 2>/dev/null || true
          
          # TensorFlow : supprimer datasets et examples
          rm -rf antenv/lib/python*/site-packages/tensorflow/python/keras/datasets 2>/dev/null || true
          rm -rf antenv/lib/python*/site-packages/tensorflow/examples 2>/dev/null || true
          
          # Supprimer les fichiers .a (archives statiques non nécessaires en prod)
          find antenv -name "*.a" -delete 2>/dev/null || true
          
          echo "✅ Nettoyage terminé"
      
      - name: 📊 Check sizes before compression
        run: |
          echo "📦 Taille du venv avant compression :"
          du -sh antenv
          echo ""
          echo "📦 Top 10 des plus gros répertoires :"
          du -h antenv | sort -rh | head -10
      
      - name: 📦 Create optimized deployment package
        run: |
          chmod +x startup.sh
          
          # Créer le ZIP en excluant les fichiers inutiles
          zip -r -q deployment.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pyc" \
            -x "*.pyo" \
            -x "*.pytest_cache*" \
            -x "*/.pytest_cache/*" \
            -x "*/tests/*" \
            -x "*/test/*"
          
          echo "✅ ZIP créé avec succès"
      
      - name: 📊 Check final package size
        run: |
          SIZE=$(du -h deployment.zip | cut -f1)
          SIZE_MB=$(du -m deployment.zip | cut -f1)
          echo "📦 Taille finale du package : $SIZE ($SIZE_MB MB)"
          
          if [ $SIZE_MB -gt 4000 ]; then
            echo "⚠️  ATTENTION : Package très volumineux (> 4 GB)"
          fi
      
      - name: 📤 Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deployment.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: ⬇️ Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: 🔑 Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_54A7FF66F8054EB1B16D1A25EA462941 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AD088C46B3AE4343A5221F4B1ED7D88E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7012C8572B35404E80AA01FAAD67D06E }}
      
      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'openclassrooms-api'
          slot-name: 'Production'
          package: deployment.zip
