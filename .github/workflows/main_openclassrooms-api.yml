name: Build and deploy Python app to Azure Web App - openclassrooms-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  VENV_NAME: 'antenv' 
  DEPLOYMENT_PACKAGE: 'deployment_package.zip' #Variable pour le nom du fichier ZIP

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout repository and LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐍 Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip' 
          
      #🛠️ INSTALLATION DES DÉPENDANCES SUR GITHUB (ET NON AZURE !)
      - name: Install dependencies and Build Environment
        run: |
          #1. Mise à jour de pip
          python -m pip install --upgrade pip
          
          #2. Création de l'environnement virtuel 'antenv'
          python -m venv ${{ env.VENV_NAME }}
          source ${{ env.VENV_NAME }}/bin/activate
          
          #3. Installation des dépendances lourdes
          pip install --no-cache-dir -r requirements.txt
          pip freeze > requirements.txt
          
      - name: 📦 Create Deployment Package (ZIP)
        run: |
          #On s'assure que le script de démarrage est exécutable
          chmod +x startup.sh
          #Création du ZIP incluant le dossier 'antenv'
          #ATTENTION : ajout du '-r' pour récursif
          zip -r ${{ env.DEPLOYMENT_PACKAGE }} . -x "*.git*" "*__pycache__*" 
          
      - name: 📤 Upload Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app-package
          path: ${{ env.DEPLOYMENT_PACKAGE }} #Utilisation de la variable d'environnement

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write 
      contents: read 

    steps:
      - name: ⬇️ Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: python-app-package
          path: .

      - name: 🔑 Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_54A7FF66F8054EB1B16D1A25EA462941 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AD088C46B3AE4343A5221F4B1ED7D88E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7012C8572B35404E80AA01FAAD67D06E }}

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'openclassrooms-api'
          slot-name: 'Production'
          #On force l'action à pointer sur le fichier ZIP téléchargé !
          package: ${{ env.DEPLOYMENT_PACKAGE }} 
          startup-command: './startup.sh'
